# Render Blueprint for CanidKnot.
#
# Deploys a Next.js web service against a Render-managed Postgres instance.
# Apply once via the Render dashboard ("New +" → "Blueprint", point at this
# repo) to provision both resources together; subsequent pushes to the
# connected branch redeploy the web service automatically.
#
# Schema changes are applied by the `preDeployCommand` below — a step that
# runs to completion BEFORE the new instance starts serving traffic, and
# BEFORE the old instance is torn down if the command fails. This replaces
# the previous platform's `prisma db push`-on-boot behavior with versioned,
# reviewable `prisma migrate deploy`. The app's own startup hook
# (src/instrumentation.ts) never mutates schema — it only seeds idempotent
# reference data into tables that this step has already created.
#
# See: https://render.com/docs/deploy-node-express-app (Node service basics)
#      https://render.com/docs/pre-deploy-command
#      https://render.com/docs/blueprint-spec

databases:
  - name: canidknot-db
    plan: basic-256mb # bump as real traffic/data volume requires
    region: singapore # closest Render region to India; revisit if latency data says otherwise
    postgresMajorVersion: "16"
    ipAllowList: [] # no external DB access; only the web service (same Render private network) connects

services:
  - type: web
    name: canidknot-web
    runtime: node
    plan: starter # bump as real traffic requires
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:migrate:deploy
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: canidknot-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false # set to the real public origin (e.g. https://canidknot.com) in the Render dashboard
      - key: SEO_INDEXABLE
        value: "true" # only on the real production service — leave unset/false on any preview/staging service
      # Reserved for later phases — added here as documentation, left unset
      # until the corresponding phase wires the reading code:
      #   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME,
      #   R2_PUBLIC_HOSTNAME, IMAGE_REMOTE_HOSTS (Phase 5)
      #   SESSION_SECRET, OTP_PROVIDER_API_KEY (Phase 2)
      #   EMAIL_PROVIDER_API_KEY, PUSH_PROVIDER_API_KEY (Phase 14)
